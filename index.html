const API_BASE_URL = "https://mls-chatbot-2g4f.onrender.com";
const ANTHROPIC_PROXY_URL = API_BASE_URL + "/api/chat";

const SYSTEM_PROMPT = `Vous êtes l'assistant commercial virtuel de Medical Laboratoire Service (MLS), distributeur marocain de dispositifs médicaux (plus de 3000 références, site https://www.mlslabo.ma/).

Catégories disponibles : Diagnostic, Appareils électromédicaux, Instrumentation, Équipement médico-hospitalier, Aide patient & aide à la marche, Orthopédie, Sabots & vêtements médicaux, Gériatrie, Médical et pharmacie, Poids & mesures, Consommable médical, Santé et bien-être, Accessoires divers, Matériel didactique de médecine.

Votre rôle : répondre aux questions des prospects et clients sur les produits, donner des recommandations pertinentes, comprendre le projet du prospect, et orienter vers une demande de devis ou une mise en contact avec l'équipe commerciale.

Couverture géographique (zones de livraison/commerciaux), à utiliser pour répondre à toute question sur une ville, une livraison ou un commercial régional. Si un client mentionne une ville absente de cette liste, identifiez la zone la plus proche ou la région marocaine correspondante pour répondre de façon cohérente (par exemple, une ville proche de Rabat ou Casablanca suit en général les mêmes délais que ces villes) :
ZONE 1 (Rania) : Berkane, Agadir, Dakhla, Guelmim, Laâyoune, Fès, Oujda, Marrakech, Safi, Ouarzazate, Guercif, Inezgane, Aït Melloul
ZONE 2 (Houria) : Casablanca, Jemaa Shaim, Kasba Tadla, Settat, Oualad Taima, Béni Mellal, Khouribga, Mohammedia, Fkih Ben Salah, Ben Slimane
ZONE 3 (Niemat) : Larache, Ksar El Kébir, Tiflet, Kénitra, Rabat, Salé, Tanger, Témara, Skhirat, Jorf El Melha
ZONE 4 (Fatima) : Chefchaouen, Fnideq, Imzouren, Khénifra, M'diq, Al Hoceïma, Meknès, Souk Larbaa, Taza, Sidi Slimane, Tétouan, Khémisset, Nador, Ouezzane
ZONE 5 (Ibtissam) : Chtouka Aït Baha, Bouarfa, Tan-Tan, Kelaat Sraghna, Essaouira, El Jadida, Berrechid, El Youssoufia, Had Soualem, Azrou, Séfrou, Sidi Kacem, Boujdour, Taroudant, Tiznit, Errachidia, Tinghir, Zagora

Règles strictes :
- Ton formel, vouvoiement systématique, professionnel, sobre, jamais familier ni trop "vendeur".
- Cherchez à comprendre le projet ou le contexte du prospect (type de structure : cabinet, clinique, hôpital, EHPAD, etc., taille, échéance) lorsque c'est pertinent, par une question simple et naturelle, afin de mieux orienter vos recommandations et d'informer notre équipe commerciale.
- Rédigez exclusivement en texte brut, sans aucun markdown (pas d'astérisques, pas de dièses, pas de tirets de titre). Pour une liste, utilisez des phrases simples ou des tirets basiques.
- Utilisez l'outil de recherche web pour obtenir des informations à jour, en vous limitant exclusivement au site mlslabo.ma (incluez "site:mlslabo.ma" dans vos recherches autant que possible). N'utilisez aucune autre source pour parler des produits MLS.
- Pour toute question géographique (livraison, délais, couverture par ville), utilisez la liste des zones ci-dessus pour rattacher la ville mentionnée à sa zone/région, puis appuyez-vous sur les informations de livraison trouvées sur mlslabo.ma pour cette région (par exemple, si le site indique une livraison à Rabat et Casablanca sous X jours et "reste du Maroc" sous Y jours, une ville d'une autre zone suit la règle "reste du Maroc"). Ne répondez jamais "je ne sais pas" à une question de livraison pour une ville marocaine sans avoir fait ce rapprochement géographique.
- Ne donnez jamais de prix précis : les tarifs ne sont pas publics. Orientez systématiquement vers une demande de devis pour obtenir un prix.
- Avant de proposer des produits, évaluez si la demande est suffisamment précise. Si la demande est vague ou trop large (ex : une marque entière, une catégorie complète, plusieurs types d'appareils différents possibles), ne listez PAS automatiquement des produits au hasard : posez une ou deux questions courtes et concrètes pour cerner le besoin exact (usage prévu, type de structure, gamme/budget visé, caractéristique recherchée), puis attendez la réponse avant de proposer des produits.
- Ne présentez jamais plus de 3 produits dans une même réponse. Si plus de 3 produits semblent pertinents, sélectionnez les 3 plus adaptés selon le contexte et, si besoin, posez une question pour affiner plutôt que d'en lister davantage.
- Gardez vos réponses lisibles : résumez l'essentiel en quelques phrases courtes plutôt que de tout détailler, et structurez par des phrases simples plutôt que des paragraphes denses.
- Pour CHAQUE produit que vous présentez ou recommandez (maximum 3, voir règle ci-dessus), même dans une liste de plusieurs produits, insérez le bloc structuré suivant juste après la ou les phrases qui en parlent (pas regroupés à la fin du message), avec ces clés uniquement (n'omettez aucun produit cité) :
<PRODUCT>{"name":"nom du produit","ref":"référence exacte du produit telle qu'indiquée sur la page mlslabo.ma (laissez vide si introuvable)","description":"description en 1 phrase, 20 mots maximum","url":"lien exact vers la page produit mlslabo.ma","category":"catégorie en MAJUSCULES (ex: ORTHOPÉDIE, DIAGNOSTIC, INSTRUMENTATION)"}</PRODUCT>
- La description de chaque produit doit être courte (1 phrase, 20 mots maximum). Si la description trouvée sur le site est plus longue, résumez-la vous-même en gardant l'information essentielle (nature du produit, usage principal), sans la recopier intégralement.
- Si l'utilisateur exprime une intention claire de demande de devis (prix, devis, commande, quantité, achat), terminez votre réponse par <ACTION>devis</ACTION>
- Si l'utilisateur souhaite simplement être recontacté ou a une question nécessitant un commercial, terminez par <ACTION>contact</ACTION>
- Si, après avoir effectivement cherché sur mlslabo.ma et appliqué le rapprochement géographique le cas échéant, vous ne trouvez vraiment pas l'information demandée, dites-le honnêtement plutôt que d'inventer, proposez une mise en contact avec un commercial, et terminez votre réponse par <UNANSWERED>oui</UNANSWERED>
- À la fin de certaines réponses (pas toutes), si cela aide naturellement l'utilisateur à aller plus loin, proposez 2 à 3 suggestions d'actions courtes sous forme de puces cliquables, en insérant exactement : <SUGGESTIONS>["Suggestion 1","Suggestion 2"]</SUGGESTIONS>. Exemples : "Voir d'autres modèles", "Demander un devis", "Parler à un commercial", "Délais de livraison ?", "Produits similaires", "Caractéristiques techniques". N'ajoutez PAS de suggestions si la réponse se termine déjà par une question directe.
- Restez concis.`;

function ProductCard({ product, onAdd }) {
  const [qty, setQty] = useState(1);
  return (
    <div style={{ borderRadius: 14, border: "1px solid #E4E7EC", background: "#fff", overflow: "hidden", marginTop: 8, marginBottom: 4 }}>
      <div style={{ padding: "10px 12px 12px" }}>
        {product.category && (
          <div style={{ fontSize: 10, fontWeight: 700, color: "#2E9E45", textTransform: "uppercase", letterSpacing: 0.8, marginBottom: 3 }}>
            {product.category}
          </div>
        )}
        <a href={product.url} target="_blank" rel="noopener noreferrer"
          style={{ fontSize: 13, fontWeight: 700, color: "#1E2A56", textDecoration: "none", lineHeight: 1.3, display: "block" }}
          onMouseEnter={e => e.target.style.textDecoration = "underline"}
          onMouseLeave={e => e.target.style.textDecoration = "none"}>

        </a>
        {product.ref && (

        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10 }}>
          <input
            type="number" min="1" value={qty}
            onChange={(e) => setQty(Math.max(1, parseInt(e.target.value, 10) || 1))}
            style={{ width: 44, border: "1px solid #E4E7EC", borderRadius: 8, fontSize: 12, textAlign: "center", padding: "4px 0", outline: "none", color: "#2B3040" }}
          />

            onClick={() => onAdd(product, qty)}
            style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, fontSize: 12, fontWeight: 600, color: "#fff", background: "#2E9E45", border: "none", borderRadius: 8, padding: "6px 10px", cursor: "pointer", fontFamily: "inherit" }}>
            <ShoppingCart size={12} /> Ajouter au panier
          </button>
        </div>
      </div>
    </div>
  );
}

function partsToText(parts) {
  return parts.map((p) => (p.type === "text" ? p.content : p.data.name + (p.data.url ? " (" + p.data.url + ")" : ""))).join(" ");
}

function MLSChatbot() {
  const [messages, setMessages] = useState([
    {
      role: "assistant",
      parts: [{ type: "text", content: "Bonjour et bienvenue chez Medical Laboratoire Service. Je suis votre assistant commercial, à disposition pour vous renseigner sur nos produits (diagnostic, orthopédie, équipement médico-hospitalier, aide à la marche, et bien plus) et vous mettre en relation avec notre équipe. Comment puis-je vous aider ?" }],
      suggestions: ["Voir nos produits", "Demander un devis", "Trouver mon commercial"]
    }
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [cart, setCart] = useState([]);
  const [showCart, setShowCart] = useState(false);
  const [toast, setToast] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [formType, setFormType] = useState("devis");
  const [formData, setFormData] = useState({ nom: "", societe: "", telephone: "", email: "", region: "", produit: "", message: "" });
  const [formError, setFormError] = useState("");
  const [summarizing, setSummarizing] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [adminCodeInput, setAdminCodeInput] = useState("");
  const [config, setConfig] = useState({ salesEmail: "commercial@mlslabo.ma", sheetsUrl: "", zones: ZONES_DEFAULT });
  const [recentLeads, setRecentLeads] = useState([]);
  const [unansweredQuestions, setUnansweredQuestions] = useState([]);
  const [commercialVille, setCommercialVille] = useState("");
  const [adminTab, setAdminTab] = useState("general");
  const endRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch(API_BASE_URL + "/api/config");
        const data = await res.json();
        if (data) setConfig((prev) => ({ ...prev, ...data }));
      } catch (e) {}
    })();
  }, []);

  useEffect(() => {
    endRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, loading]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(""), 2500);
    return () => clearTimeout(t);
  }, [toast]);

  function parseResponse(text) {
    let action = null;
    const actionMatch = text.match(/<ACTION>(devis|contact)<\/ACTION>/);
    if (actionMatch) {
      action = actionMatch[1];
      text = text.replace(/<ACTION>(devis|contact)<\/ACTION>/, "").trim();
    }
    let unanswered = false;
    if (/<UNANSWERED>oui<\/UNANSWERED>/.test(text)) {
      unanswered = true;
      text = text.replace(/<UNANSWERED>oui<\/UNANSWERED>/, "").trim();
    }
    let suggestions = [];
    const suggestionsMatch = text.match(/<SUGGESTIONS>(\[[\s\S]*?\])<\/SUGGESTIONS>/);
    if (suggestionsMatch) {
      try { suggestions = JSON.parse(suggestionsMatch[1]); } catch (e) {}
      text = text.replace(/<SUGGESTIONS>(\[[\s\S]*?\])<\/SUGGESTIONS>/, "").trim();
    }
    const parts = [];
    const products = [];
    const productRegex = /<PRODUCT>([\s\S]*?)<\/PRODUCT>/g;
    let lastIndex = 0;
    let m;
    while ((m = productRegex.exec(text)) !== null) {
      const chunk = text.slice(lastIndex, m.index).trim();
      if (chunk) parts.push({ type: "text", content: chunk });
      try {
        const obj = JSON.parse(m[1]);
        if (obj && obj.name) {
          parts.push({ type: "product", data: obj });
          products.push(obj);
        }
      } catch (e) {}
      lastIndex = productRegex.lastIndex;
    }
    const remaining = text.slice(lastIndex).trim();
    if (remaining) parts.push({ type: "text", content: remaining });
    if (parts.length === 0) parts.push({ type: "text", content: text.trim() });
    return { parts, products, action, unanswered, suggestions };
  }

  async function sendMessage(text) {
    const content = typeof text === "string" ? text.trim() : input.trim();
    if (!content || loading) return;
    const newMessages = [...messages, { role: "user", parts: [{ type: "text", content }] }];
    setMessages(newMessages);
    setInput("");
    setLoading(true);
    try {
      const apiMessages = newMessages.map((m) => ({ role: m.role, content: partsToText(m.parts) }));
      const res = await fetch(ANTHROPIC_PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: SYSTEM_PROMPT,
          messages: apiMessages,
          tools: [{ type: "web_search_20250305", name: "web_search" }]
        })
      });
      const data = await res.json();
      const rawText = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
      const { parts, products, action, unanswered, suggestions } = parseResponse(rawText || "Je n'ai pas pu trouver de réponse précise. Souhaitez-vous être mis en contact avec un commercial ?");
      setMessages((prev) => [...prev, { role: "assistant", parts, suggestions }]);
      if (action === "devis" && products.length > 0) {
        products.forEach((p) => addToCart(p, 1));
      }
      if (unanswered) {
        try {
          await fetch(API_BASE_URL + "/api/unanswered", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ timestamp: new Date().toISOString(), question: content })
          });
        } catch (e) {}
      }
    } catch (e) {
      setMessages((prev) => [...prev, { role: "assistant", parts: [{ type: "text", content: "Désolé, une erreur technique est survenue. Vous pouvez réessayer ou demander directement à être recontacté." }], suggestions: [] }]);
    } finally {
      setLoading(false);
    }
  }

  function addToCart(product, quantity) {
    const qty = Math.max(1, parseInt(quantity, 10) || 1);
    setCart((prev) => {
      const idx = prev.findIndex((p) => p.name === product.name);
      if (idx >= 0) {
        const copy = [...prev];
        copy[idx] = { ...copy[idx], quantity: copy[idx].quantity + qty };
        return copy;
      }
      return [...prev, { name: product.name, url: product.url || "", ref: product.ref || "", quantity: qty }];
    });
    setToast("Ajouté : " + product.name + " (x" + qty + ")");
  }

  function updateQty(index, delta) {
    setCart((prev) => {
      const copy = [...prev];
      copy[index] = { ...copy[index], quantity: Math.max(1, copy[index].quantity + delta) };
      return copy;
    });
  }

  function setQtyDirect(index, value) {
    const n = Math.max(1, parseInt(value, 10) || 1);
    setCart((prev) => {
      const copy = [...prev];
      copy[index] = { ...copy[index], quantity: n };
      return copy;
    });
  }

  function removeFromCart(index) {
    setCart((prev) => prev.filter((_, i) => i !== index));
  }

  function cartCount() {
    return cart.reduce((sum, i) => sum + i.quantity, 0);
  }

  function produitsSummary() {
    return cart.map((i) => i.name + (i.ref ? " (Réf. " + i.ref + ")" : "") + " (x" + i.quantity + ")" + (i.url ? " - " + i.url : "")).join("\n");
  }

  async function generateSummary() {
    const convo = messages.filter((m) => m.role === "user").map((m) => "Client : " + partsToText(m.parts)).join("\n");
    if (!convo) return "";
    try {
      const res = await fetch(ANTHROPIC_PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: "Résumez en 2 à 3 phrases, en français, de façon factuelle et formelle, le projet et le besoin exprimés par ce prospect (contexte, type de structure si mentionné, produits envisagés), à l'attention d'un commercial. Texte brut uniquement, sans markdown. Ne donnez que le résumé, sans préambule.",
          messages: [{ role: "user", content: convo }]
        })
      });
      const data = await res.json();
      return (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join(" ").trim();
    } catch (e) {
      return "";
    }
  }

  async function openForm(type, fallbackProduct) {
    setFormType(type);
    setFormError("");
    setShowForm(true);
    if (type === "contact") return;
    const produit = cart.length > 0 ? produitsSummary() : (fallbackProduct || "");
    setFormData((prev) => ({ ...prev, produit, message: "" }));
    const hasUserTurns = messages.some((m) => m.role === "user");
    if (hasUserTurns) {
      setSummarizing(true);
      const summary = await generateSummary();
      setFormData((prev) => ({ ...prev, message: summary || prev.message }));
      setSummarizing(false);
    }
  }

  async function handleSubmitForm() {
    if (!formData.nom || !formData.societe || !formData.region || (!formData.telephone && !formData.email)) {
      setFormError("Merci de renseigner votre nom, le nom de l'entreprise, la région, et au moins un moyen de contact.");
      return;
    }
    setFormError("");
    const payload = { timestamp: new Date().toISOString(), type: formType, ...formData, cartItems: cart };
    try {
      await fetch(API_BASE_URL + "/api/leads", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    } catch (e) {}
    if (config.sheetsUrl) {
      try {
        await fetch(config.sheetsUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
      } catch (e) {}
    }
    setShowForm(false);
    setMessages((prev) => [...prev, {
      role: "assistant",
      parts: [{ type: "text", content: "Merci " + formData.nom + ", votre demande a bien été transmise à notre équipe commerciale. Nous reviendrons vers vous très rapidement." }],
      suggestions: []
    }]);
    setFormData({ nom: "", societe: "", telephone: "", email: "", region: "", produit: "", message: "" });
    setCart([]);
  }

  async function loadLeads() {
    try {
      const res = await fetch(API_BASE_URL + "/api/leads");
      const data = await res.json();
      setRecentLeads((data || []).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)));
    } catch (e) {}
  }

  async function loadUnanswered() {
    try {
      const res = await fetch(API_BASE_URL + "/api/unanswered");
      const data = await res.json();
      setUnansweredQuestions((data || []).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)));
    } catch (e) {}
  }

  async function deleteUnanswered(id) {
    try { await fetch(API_BASE_URL + "/api/unanswered/" + id, { method: "DELETE" }); } catch (e) {}
    setUnansweredQuestions((prev) => prev.filter((q) => q.id !== id));
  }

  async function saveConfig() {
    try {
      await fetch(API_BASE_URL + "/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(config)
      });
    } catch (e) {}
    setShowAdmin(false);
  }

  function unlockAdmin() {
    if (adminCodeInput === ADMIN_CODE) {
      setAdminUnlocked(true);
      loadLeads();
      loadUnanswered();
    } else {
      setAdminUnlocked(false);
    }
  }

  function getZones() {
    return config.zones && config.zones.length > 0 ? config.zones : ZONES_DEFAULT;
  }

  function allVilles() {
    const out = [];
    getZones().forEach((z) => (z.villes || []).forEach((v) => out.push({ ville: v, zone: z })));
    return out.sort((a, b) => a.ville.localeCompare(b.ville));
  }

  function findZoneByVille(ville) {
    return getZones().find((z) => (z.villes || []).includes(ville)) || null;
  }

  function updateZoneField(index, field, value) {
    setConfig((prev) => {
      const zones = [...getZones()];
      if (field === "villes") {
        zones[index] = { ...zones[index], villes: value.split(",").map((v) => v.trim()).filter(Boolean) };
      } else {
        zones[index] = { ...zones[index], [field]: value };
      }
      return { ...prev, zones };
    });
  }

  function addZone() {
    setConfig((prev) => ({ ...prev, zones: [...getZones(), { zone: "Nouvelle zone", commercial: "", telephone: "", villes: [] }] }));
  }

  function removeZone(index) {
    setConfig((prev) => ({ ...prev, zones: getZones().filter((_, i) => i !== index) }));
  }

  /* ====== RENDER ====== */
  return (
    <div style={{ display: "flex", flexDirection: "column", width: "100%", height: "100%", background: "#F6F7FA", overflow: "hidden", position: "relative" }}>

      {/* ── Header ── */}
      <div style={{ background: "#fff", borderBottom: "1px solid #E4E7EC", padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ display: "flex", alignItems: "baseline", lineHeight: 1 }}>
            <span style={{ fontSize: 22, fontWeight: 800, color: "#1E2A56" }}>M</span>
            <span style={{ fontSize: 22, fontWeight: 800, color: "#2E9E45" }}>L</span>
            <span style={{ fontSize: 22, fontWeight: 800, color: "#1E2A56" }}>S</span>
          </div>
          <div style={{ borderLeft: "1px solid #E4E7EC", paddingLeft: 10 }}>
            <div style={{ fontWeight: 700, color: "#1E2A56", fontSize: 13, lineHeight: 1.2 }}>Assistant commercial MLS</div>
            <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 2 }}>
              <span style={{ width: 7, height: 7, borderRadius: "50%", background: "#2E9E45", display: "inline-block" }}></span>
              <span style={{ fontSize: 11, color: "#6B7280", fontWeight: 500 }}>En ligne · répond en quelques secondes</span>
            </div>
          </div>
        </div>
        <button
          onClick={() => { setShowAdmin(true); setAdminUnlocked(false); setAdminCodeInput(""); }}
          style={{ color: "#8B96A8", background: "none", border: "none", cursor: "pointer", padding: 4, borderRadius: 6 }}
          title="Configuration">
          <Settings size={17} />
        </button>
      </div>

      {/* ── Messages ── */}
      <div style={{ flex: 1, overflowY: "auto", padding: "16px 12px", display: "flex", flexDirection: "column", gap: 4 }}>
        {messages.map((m, i) => (
          <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: m.role === "user" ? "flex-end" : "flex-start", marginBottom: 4 }}>
            <div style={{ maxWidth: "78%", minWidth: 0 }}>
              <div style={{
                background: m.role === "user" ? "#1E2A56" : "#fff",
                color: m.role === "user" ? "#fff" : "#2B3040",
                border: m.role === "user" ? "none" : "1px solid #E4E7EC",
                borderRadius: m.role === "user" ? "18px 18px 4px 18px" : "18px 18px 18px 4px",
                padding: "10px 14px",
                fontSize: 13,
                lineHeight: 1.6,
                fontWeight: 400
              }}>
                {m.parts.map((part, k) =>
                  part.type === "text" ? (
                    <div key={k} style={{ whiteSpace: "pre-wrap" }}>{part.content}</div>
                  ) : (
                    <ProductCard key={k} product={part.data} onAdd={addToCart} />
                  )
                )}
              </div>
            </div>
            {/* Suggestion chips */}
            {m.role === "assistant" && m.suggestions && m.suggestions.length > 0 && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 8, maxWidth: "90%" }}>
                {m.suggestions.map((s, k) => (
                  <button key={k} onClick={() => sendMessage(s)}
                    style={{
                      fontSize: 12, fontWeight: 600, color: "#1E2A56",
                      background: "#fff", border: "1.5px solid #E4E7EC",
                      borderRadius: 999, padding: "5px 12px", cursor: "pointer",
                      fontFamily: "inherit", transition: "border-color 0.15s, background 0.15s",
                      outline: "none"
                    }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = "#1E2A56"; e.currentTarget.style.background = "#F6F7FA"; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = "#E4E7EC"; e.currentTarget.style.background = "#fff"; }}>
                    {s}
                  </button>
                ))}
              </div>
            )}
          </div>
        ))}

        {/* Loading dots */}
        {loading && (
          <div style={{ display: "flex", justifyContent: "flex-start" }}>
            <div style={{ background: "#fff", border: "1px solid #E4E7EC", borderRadius: "18px 18px 18px 4px", padding: "12px 16px", display: "flex", alignItems: "center", gap: 5 }}>
              {[0, 150, 300].map((delay, i) => (
                <span key={i} className="dot-bounce" style={{ width: 7, height: 7, background: "#8B96A8", borderRadius: "50%", display: "inline-block", animationDelay: delay + "ms" }}></span>
              ))}
            </div>
          </div>
        )}
        <div ref={endRef} />
      </div>

      {/* Toast */}
      {toast && (
        <div style={{
          position: "absolute", left: "50%", bottom: 84,
          transform: "translateX(-50%)",
          background: "#2B3040", color: "#fff", fontSize: 12, fontWeight: 600,
          borderRadius: 999, padding: "7px 16px", boxShadow: "0 4px 16px rgba(0,0,0,0.15)",
          whiteSpace: "nowrap", zIndex: 20
        }}>
          {toast}
        </div>
      )}

      {/* ── Action buttons + Input ── */}
      <div style={{ background: "#fff", borderTop: "1px solid #E4E7EC", flexShrink: 0 }}>
        <div style={{ padding: "10px 12px 0", display: "flex", justifyContent: "center" }}>
          <div style={{ display: "flex", gap: 8, width: "100%", maxWidth: 480 }}>
            <button
              onClick={() => setShowCart(true)}
              style={{
                flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                fontSize: 13, fontWeight: 700, color: "#2E9E45",
                background: "#fff", border: "1.5px solid #2E9E45",
                borderRadius: 10, padding: "8px 4px", cursor: "pointer", fontFamily: "inherit"
              }}>
              <ShoppingCart size={14} /> Panier
              {cartCount() > 0 && (
                <span style={{ background: "#2E9E45", color: "#fff", borderRadius: 999, fontSize: 10, fontWeight: 700, padding: "1px 6px", lineHeight: 1.5 }}>
                  {cartCount()}
                </span>
              )}
            </button>
            <button
              onClick={() => { setCommercialVille(""); openForm("contact", ""); }}
              style={{
                flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
                fontSize: 13, fontWeight: 700, color: "#1E2A56",
                background: "#fff", border: "1.5px solid #1E2A56",
                borderRadius: 10, padding: "8px 4px", cursor: "pointer", fontFamily: "inherit"
              }}>
              <Phone size={14} /> Commercial
            </button>
          </div>
        </div>
        <div style={{ padding: "10px 12px 12px", display: "flex", gap: 8, alignItems: "center" }}>
          <input
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") sendMessage(); }}
            placeholder="Posez votre question sur nos produits..."
            style={{
              flex: 1, border: "1.5px solid #E4E7EC", borderRadius: 12,
              padding: "10px 14px", fontSize: 13, outline: "none",
              color: "#2B3040", background: "#F6F7FA", fontFamily: "inherit",
              transition: "border-color 0.15s"
            }}
            onFocus={e => e.target.style.borderColor = "#1E2A56"}
            onBlur={e => e.target.style.borderColor = "#E4E7EC"}
          />
          <button
            onClick={() => sendMessage()}
            disabled={loading}
            style={{
              width: 42, height: 42, borderRadius: 12,
              background: loading ? "#8B96A8" : "#2E9E45",
              border: "none", color: "#fff", cursor: loading ? "default" : "pointer",
              display: "flex", alignItems: "center", justifyContent: "center",
              flexShrink: 0, transition: "background 0.15s"
            }}>
            {loading ? <Loader2 size={16} /> : <Send size={16} />}
          </button>
        </div>
      </div>

      {/* ── Modal Panier ── */}
      {showCart && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(30,42,86,0.4)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50, padding: 0 }}>
          <div style={{ background: "#fff", borderRadius: "20px 20px 0 0", padding: "20px 16px 32px", width: "100%", maxWidth: 480, maxHeight: "80vh", overflowY: "auto" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div style={{ fontWeight: 800, color: "#1E2A56", fontSize: 16 }}>Panier — Demande de devis</div>
              <button onClick={() => setShowCart(false)} style={{ background: "none", border: "none", cursor: "pointer", color: "#8B96A8" }}><X size={18} /></button>
            </div>
            {cart.length === 0 ? (
              <div style={{ fontSize: 13, color: "#6B7280", textAlign: "center", padding: "24px 0" }}>
                Aucun produit sélectionné.<br />Ajoutez des produits depuis les réponses de l'assistant.
              </div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {cart.map((item, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, border: "1px solid #E4E7EC", borderRadius: 12, padding: "10px 12px" }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      {item.url ? (
                        <a href={item.url} target="_blank" rel="noopener noreferrer" style={{ fontSize: 13, fontWeight: 700, color: "#1E2A56", textDecoration: "none" }}>{item.name}</a>
                      ) : (
                        <div style={{ fontSize: 13, fontWeight: 700, color: "#2B3040" }}>{item.name}</div>
                      )}
                      {item.ref && <div style={{ fontSize: 11, color: "#8B96A8", marginTop: 1 }}>Réf. {item.ref}</div>}
                      <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 6 }}>
                        <button onClick={() => updateQty(i, -1)} style={{ width: 26, height: 26, border: "1px solid #E4E7EC", borderRadius: 6, background: "#fff", cursor: "pointer", fontSize: 14, color: "#6B7280" }}>-</button>
                        <input type="number" min="1" value={item.quantity} onChange={(e) => setQtyDirect(i, e.target.value)} style={{ width: 40, border: "1px solid #E4E7EC", borderRadius: 6, fontSize: 12, textAlign: "center", padding: "3px 0", fontFamily: "inherit" }} />
                        <button onClick={() => updateQty(i, 1)} style={{ width: 26, height: 26, border: "1px solid #E4E7EC", borderRadius: 6, background: "#fff", cursor: "pointer", fontSize: 14, color: "#6B7280" }}>+</button>
                      </div>
                    </div>
                    <button onClick={() => removeFromCart(i)} style={{ background: "none", border: "none", cursor: "pointer", color: "#8B96A8", flexShrink: 0 }}><X size={16} /></button>
                  </div>
                ))}
              </div>
            )}
            {cart.length > 0 && (
              <button
                onClick={() => { setShowCart(false); openForm("devis", ""); }}
                style={{ width: "100%", marginTop: 16, background: "#1E2A56", color: "#fff", border: "none", borderRadius: 12, padding: "13px", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
                Envoyer ma demande de devis ({cartCount()} article{cartCount() > 1 ? "s" : ""})
              </button>
            )}
          </div>
        </div>
      )}

      {/* ── Modal Contact ── */}
      {showForm && formType === "contact" && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(30,42,86,0.4)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }}>
          <div style={{ background: "#fff", borderRadius: "20px 20px 0 0", padding: "20px 16px 32px", width: "100%", maxWidth: 480 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
              <div style={{ fontWeight: 800, color: "#1E2A56", fontSize: 16 }}>Trouver mon commercial</div>
              <button onClick={() => setShowForm(false)} style={{ background: "none", border: "none", cursor: "pointer", color: "#8B96A8" }}><X size={18} /></button>
            </div>
            <div style={{ fontSize: 12, color: "#6B7280", marginBottom: 10 }}>Choisissez votre ville pour connaître le commercial assigné à votre région.</div>
            <select value={commercialVille} onChange={(e) => setCommercialVille(e.target.value)}
              style={{ width: "100%", border: "1.5px solid #E4E7EC", borderRadius: 10, padding: "10px 12px", fontSize: 13, color: "#2B3040", background: "#F6F7FA", fontFamily: "inherit", outline: "none" }}>
              <option value="">Choisissez votre ville</option>
              {allVilles().map((v, i) => <option key={i} value={v.ville}>{v.ville}</option>)}
            </select>
            {commercialVille && (() => {
              const zone = findZoneByVille(commercialVille);
              if (!zone) return <div style={{ marginTop: 12, fontSize: 13, color: "#6B7280" }}>Aucun commercial assigné à cette ville pour l'instant.</div>;
              return (
                <div style={{ marginTop: 12, border: "1px solid #E4E7EC", borderRadius: 12, padding: "12px 14px", background: "#F6F7FA" }}>
                  <div style={{ fontWeight: 700, color: "#1E2A56", fontSize: 14 }}>{zone.commercial || "Commercial à venir"}</div>
                  <div style={{ fontSize: 13, color: "#6B7280", marginTop: 3 }}>
                    {zone.telephone ? <a href={"tel:" + zone.telephone} style={{ color: "#2E9E45", fontWeight: 600 }}>{zone.telephone}</a> : "Numéro à venir"}
                  </div>
                  <div style={{ fontSize: 11, color: "#8B96A8", marginTop: 4 }}>{zone.zone}</div>
                </div>
              );
            })()}
          </div>
        </div>
      )}

      {/* ── Modal Devis ── */}
      {showForm && formType === "devis" && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(30,42,86,0.4)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }}>
          <div style={{ background: "#fff", borderRadius: "20px 20px 0 0", padding: "20px 16px 24px", width: "100%", maxWidth: 480, maxHeight: "85vh", overflowY: "auto" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div style={{ fontWeight: 800, color: "#1E2A56", fontSize: 16 }}>Demande de devis</div>
              <button onClick={() => setShowForm(false)} style={{ background: "none", border: "none", cursor: "pointer", color: "#8B96A8" }}><X size={18} /></button>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {[
                { ph: "Nom de l'entreprise *", key: "societe" },
                { ph: "Nom du contact *", key: "nom" },
                { ph: "Téléphone", key: "telephone" },
                { ph: "Email", key: "email", type: "email" }
              ].map(({ ph, key, type }) => (
                <input key={key} type={type || "text"} placeholder={ph} value={formData[key]}
                  onChange={(e) => setFormData({ ...formData, [key]: e.target.value })}
                  style={{ width: "100%", border: "1.5px solid #E4E7EC", borderRadius: 10, padding: "10px 12px", fontSize: 13, color: "#2B3040", fontFamily: "inherit", outline: "none", boxSizing: "border-box" }}
                  onFocus={e => e.target.style.borderColor = "#1E2A56"}
                  onBlur={e => e.target.style.borderColor = "#E4E7EC"}
                />
              ))}
              <div style={{ fontSize: 11, color: "#8B96A8", marginTop: -4 }}>Téléphone ou email requis (au moins l'un des deux)</div>
              <select value={formData.region} onChange={(e) => setFormData({ ...formData, region: e.target.value })}
                style={{ width: "100%", border: "1.5px solid #E4E7EC", borderRadius: 10, padding: "10px 12px", fontSize: 13, color: formData.region ? "#2B3040" : "#8B96A8", fontFamily: "inherit", background: "#fff", outline: "none" }}>
                <option value="">Votre ville *</option>
                {allVilles().map((v, i) => <option key={i} value={v.ville}>{v.ville}</option>)}
              </select>
              <textarea placeholder="Produit(s) concerné(s)" value={formData.produit}
                onChange={(e) => setFormData({ ...formData, produit: e.target.value })}
                rows={3}
                style={{ width: "100%", border: "1.5px solid #E4E7EC", borderRadius: 10, padding: "10px 12px", fontSize: 13, color: "#2B3040", fontFamily: "inherit", resize: "none", outline: "none", boxSizing: "border-box" }}
                onFocus={e => e.target.style.borderColor = "#1E2A56"}
                onBlur={e => e.target.style.borderColor = "#E4E7EC"}
              />
              <textarea
                placeholder={summarizing ? "Génération du résumé en cours..." : "Résumé du projet et du besoin"}
                value={formData.message}
                onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                rows={3}
                style={{ width: "100%", border: "1.5px solid #E4E7EC", borderRadius: 10, padding: "10px 12px", fontSize: 13, color: "#2B3040", fontFamily: "inherit", resize: "none", outline: "none", boxSizing: "border-box" }}
                onFocus={e => e.target.style.borderColor = "#1E2A56"}
                onBlur={e => e.target.style.borderColor = "#E4E7EC"}
              />
              {formError && <div style={{ fontSize: 12, color: "#dc2626", fontWeight: 500 }}>{formError}</div>}
              <button type="button" onClick={handleSubmitForm}
                style={{ width: "100%", background: "#1E2A56", color: "#fff", border: "none", borderRadius: 12, padding: "13px", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", marginTop: 4 }}>
                Envoyer la demande
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── Modal Admin ── */}
      {showAdmin && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(30,42,86,0.4)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }}>
          <div style={{ background: "#fff", borderRadius: "20px 20px 0 0", padding: "20px 16px 32px", width: "100%", maxWidth: 480, maxHeight: "85vh", overflowY: "auto" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div style={{ fontWeight: 800, color: "#1E2A56", fontSize: 16 }}>Configuration</div>
              <button onClick={() => setShowAdmin(false)} style={{ background: "none", border: "none", cursor: "pointer", color: "#8B96A8" }}><X size={18} /></button>
            </div>
            {!adminUnlocked ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <div style={{ fontSize: 12, color: "#6B7280" }}>Réservé à l'équipe MLS. Saisissez le code d'accès.</div>
                <input type="password" value={adminCodeInput}
                  onChange={(e) => setAdminCodeInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") unlockAdmin(); }}
                  placeholder="Code d'accès"
                  style={{ width: "100%", border: "1.5px solid #E4E7EC", borderRadius: 10, padding: "10px 12px", fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box" }} />
                <button onClick={unlockAdmin}
                  style={{ width: "100%", background: "#1E2A56", color: "#fff", border: "none", borderRadius: 12, padding: "12px", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
                  Valider
                </button>
              </div>
            ) : (
              <div>
                <div style={{ display: "flex", borderBottom: "1px solid #E4E7EC", marginBottom: 16 }}>
                  {[{ key: "general", label: "Général" }, { key: "zones", label: "Zones" }, { key: "demandes", label: "Demandes" }, { key: "questions", label: "Questions" }].map((t) => (
                    <button key={t.key} onClick={() => setAdminTab(t.key)}
                      style={{
                        flex: 1, fontSize: 12, fontWeight: 600, padding: "8px 4px", border: "none", background: "none", cursor: "pointer", fontFamily: "inherit",
                        color: adminTab === t.key ? "#1E2A56" : "#8B96A8",
                        borderBottom: "2px solid " + (adminTab === t.key ? "#1E2A56" : "transparent"),
                        marginBottom: -1
                      }}>
                      {t.label}
                    </button>
                  ))}
                </div>

                {adminTab === "general" && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                    <div>
                      <div style={{ fontSize: 11, fontWeight: 700, color: "#6B7280", textTransform: "uppercase", letterSpacing: 0.6, marginBottom: 6 }}>Email commercial</div>
                      <input value={config.salesEmail} onChange={(e) => setConfig({ ...config, salesEmail: e.target.value })}
                        style={{ width: "100%", border: "1.5px solid #E4E7EC", borderRadius: 10, padding: "10px 12px", fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box" }} />
                    </div>
                    <div>
                      <div style={{ fontSize: 11, fontWeight: 700, color: "#6B7280", textTransform: "uppercase", letterSpacing: 0.6, marginBottom: 6 }}>URL Google Apps Script (optionnel)</div>
                      <input value={config.sheetsUrl} onChange={(e) => setConfig({ ...config, sheetsUrl: e.target.value })}
                        placeholder="https://script.google.com/macros/s/.../exec"
                        style={{ width: "100%", border: "1.5px solid #E4E7EC", borderRadius: 10, padding: "10px 12px", fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box" }} />
                    </div>
                    <button onClick={saveConfig}
                      style={{ width: "100%", background: "#1E2A56", color: "#fff", border: "none", borderRadius: 12, padding: "12px", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
                      Enregistrer
                    </button>
                  </div>
                )}

                {adminTab === "zones" && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 300, overflowY: "auto" }}>
                      {getZones().map((z, i) => (
                        <div key={i} style={{ border: "1px solid #E4E7EC", borderRadius: 10, padding: "10px 12px", display: "flex", flexDirection: "column", gap: 6 }}>
                          <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                            <input value={z.zone} onChange={(e) => updateZoneField(i, "zone", e.target.value)} placeholder="Nom de la zone"
                              style={{ flex: 1, border: "1px solid #E4E7EC", borderRadius: 8, padding: "5px 8px", fontSize: 12, fontFamily: "inherit", outline: "none" }} />
                            <button onClick={() => removeZone(i)} style={{ background: "none", border: "none", cursor: "pointer", color: "#8B96A8" }}><X size={14} /></button>
                          </div>
                          <input value={z.commercial} onChange={(e) => updateZoneField(i, "commercial", e.target.value)} placeholder="Prénom du commercial"
                            style={{ border: "1px solid #E4E7EC", borderRadius: 8, padding: "5px 8px", fontSize: 12, fontFamily: "inherit", outline: "none" }} />
                          <input value={z.telephone} onChange={(e) => updateZoneField(i, "telephone", e.target.value)} placeholder="Numéro de téléphone"
                            style={{ border: "1px solid #E4E7EC", borderRadius: 8, padding: "5px 8px", fontSize: 12, fontFamily: "inherit", outline: "none" }} />
                          <textarea value={(z.villes || []).join(", ")} onChange={(e) => updateZoneField(i, "villes", e.target.value)} rows={2} placeholder="Villes séparées par des virgules"
                            style={{ border: "1px solid #E4E7EC", borderRadius: 8, padding: "5px 8px", fontSize: 12, fontFamily: "inherit", resize: "none", outline: "none" }} />
                        </div>
                      ))}
                    </div>
                    <button onClick={addZone}
                      style={{ width: "100%", border: "1.5px dashed #E4E7EC", borderRadius: 10, padding: "9px", fontSize: 12, fontWeight: 600, color: "#6B7280", background: "none", cursor: "pointer", fontFamily: "inherit" }}>
                      + Ajouter une zone
                    </button>
                    <button onClick={saveConfig}
                      style={{ width: "100%", background: "#1E2A56", color: "#fff", border: "none", borderRadius: 12, padding: "12px", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
                      Enregistrer
                    </button>
                  </div>
                )}

                {adminTab === "demandes" && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 320, overflowY: "auto" }}>
                    {recentLeads.length === 0 && <div style={{ fontSize: 12, color: "#8B96A8", textAlign: "center", padding: "20px 0" }}>Aucune demande enregistrée.</div>}
                    {recentLeads.map((l, i) => (
                      <div key={i} style={{ border: "1px solid #E4E7EC", borderRadius: 10, padding: "10px 12px", background: "#F6F7FA" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 3 }}>
                          <span style={{ fontWeight: 700, fontSize: 13, color: "#2B3040" }}>{l.societe}</span>
                          <span style={{ fontSize: 10, fontWeight: 700, padding: "2px 7px", borderRadius: 999, background: l.type === "devis" ? "#E8F5EC" : "#F1F2F6", color: l.type === "devis" ? "#227836" : "#6B7280" }}>
                            {l.type === "devis" ? "Devis" : "Contact"}
                          </span>
                        </div>
                        <div style={{ fontSize: 12, color: "#6B7280" }}>{l.nom} · {l.telephone} · {l.email}</div>
                        <div style={{ fontSize: 12, color: "#8B96A8", marginTop: 2 }}>{l.region}</div>
                      </div>
                    ))}
                  </div>
                )}

                {adminTab === "questions" && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 320, overflowY: "auto" }}>
                    {unansweredQuestions.length === 0 && <div style={{ fontSize: 12, color: "#8B96A8", textAlign: "center", padding: "20px 0" }}>Aucune question en attente.</div>}
                    {unansweredQuestions.map((q) => (
                      <div key={q.id} style={{ border: "1px solid #E4E7EC", borderRadius: 10, padding: "10px 12px", background: "#F6F7FA", display: "flex", gap: 8, alignItems: "flex-start" }}>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 12, color: "#2B3040", lineHeight: 1.5 }}>{q.question}</div>
                          <div style={{ fontSize: 11, color: "#8B96A8", marginTop: 3 }}>{new Date(q.timestamp).toLocaleString("fr-FR")}</div>
                        </div>
                        <button onClick={() => deleteUnanswered(q.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "#8B96A8", flexShrink: 0 }}><X size={14} /></button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MLSChatbot />);
</script>
